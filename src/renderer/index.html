<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: file: https: http:; font-src 'self' data:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'">
  <meta name="color-scheme" content="light dark">
  <title>MD reader</title>
  <link rel="stylesheet" href="styles/themes.css">
  <link rel="stylesheet" href="styles/app.css">
  <link rel="stylesheet" href="styles/preview.css">
</head>
<body>
  <header class="toolbar">
    <div class="toolbar-left">
      <button id="sidebarToggle" class="toolbar-btn sidebar-toggle" style="display: none;" aria-pressed="false">
        <span class="btn-icon">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <rect x="1.5" y="2.5" width="13" height="11" rx="2" stroke="currentColor" stroke-width="1.5"/>
            <path d="M6 2.5V13.5" stroke="currentColor" stroke-width="1.5"/>
          </svg>
        </span>
        <span id="docCount" class="doc-count"></span>
      </button>
    </div>
    <div class="toolbar-center">
      <span class="file-title" id="fileTitle">MD reader</span>
    </div>
    <div class="toolbar-right">
      <button id="outlineToggle" class="toolbar-btn outline-toggle" style="display: none;" aria-pressed="false">
        <span class="btn-icon">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M6 3.5H13.5M6 8H13.5M6 12.5H13.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M3 3.5H3.01M3 8H3.01M3 12.5H3.01" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          </svg>
        </span>
      </button>
      <button id="searchToggle" class="toolbar-btn search-toggle" data-i18n-title="find" style="display: none;">
        <span class="btn-icon">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.5"/>
            <path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </span>
      </button>
      <button id="modeToggle" class="toolbar-btn mode-btn" data-i18n-title="toggleMode" style="display: none;">
        <span class="btn-icon">
          <svg class="icon-edit" width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M11.5 1.5L14.5 4.5L5 14H2V11L11.5 1.5Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <svg class="icon-read" width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M1 8C1 8 3.5 3 8 3C12.5 3 15 8 15 8C15 8 12.5 13 8 13C3.5 13 1 8 1 8Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="8" cy="8" r="2.5" stroke="currentColor" stroke-width="1.5"/>
          </svg>
        </span>
        <span class="btn-label" id="modeLabel" data-i18n="edit">Edit</span>
      </button>
      <button id="themeToggle" class="toolbar-btn theme-btn" data-i18n-title="toggleTheme">
        <span class="btn-icon">
          <svg class="icon-sun" width="16" height="16" viewBox="0 0 16 16" fill="none">
            <circle cx="8" cy="8" r="3" stroke="currentColor" stroke-width="1.5"/>
            <path d="M8 1.5V3M8 13V14.5M1.5 8H3M13 8H14.5M3.4 3.4L4.5 4.5M11.5 11.5L12.6 12.6M12.6 3.4L11.5 4.5M4.5 11.5L3.4 12.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <svg class="icon-moon" width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M14 9.5A6.5 6.5 0 016.5 2 5.5 5.5 0 1014 9.5z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
      </button>
    </div>
  </header>

  <div id="appContainer" class="app-container">
    <!-- Welcome screen -->
    <div id="welcomeScreen" class="welcome-screen">
      <div class="welcome-card">
        <div class="welcome-icon">
          <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
            <rect x="6" y="4" width="36" height="40" rx="4" stroke="currentColor" stroke-width="2.5"/>
            <path d="M14 16H34M14 24H30M14 32H26" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
          </svg>
        </div>
        <h1 class="welcome-title">MD reader</h1>
        <p class="welcome-subtitle" data-i18n="welcomeSubtitle"></p>
        <button id="openFileBtn" class="welcome-btn" data-i18n="openFile"></button>
        <p class="welcome-hint" data-i18n="welcomeHint"></p>
        <div id="recentSection" class="welcome-recent" style="display: none;">
          <div class="welcome-recent-title" data-i18n="recent"></div>
          <div id="recentList" class="welcome-recent-list"></div>
        </div>
      </div>
    </div>

    <!-- Left sidebar: open documents -->
    <aside id="sidebar" class="sidebar">
      <div id="documentsList" class="documents-list"></div>
    </aside>

    <!-- Main content area -->
    <div id="mainContent" class="main-content">
      <!-- Editor pane (hidden in read mode; editor bundle loads on first use) -->
      <div id="editorPane" class="editor-pane">
        <div id="editorContainer" class="editor-container"></div>
      </div>

      <div id="divider" class="divider"></div>

      <div id="previewPane" class="preview-pane" style="display: none;">
        <div id="previewContent" class="preview-content"></div>
      </div>
    </div>

    <aside id="outline" class="outline">
      <div class="outline-header" data-i18n="outline"></div>
      <nav id="outlineList" class="outline-list"></nav>
    </aside>
  </div>

  <!-- Find bar (read mode) -->
  <div id="searchBar" class="search-bar" style="display: none;">
    <input id="searchInput" class="search-input" type="text" data-i18n-placeholder="findPlaceholder">
    <span id="searchCount" class="search-count"></span>
    <button id="searchPrev" class="search-btn" data-i18n-title="prevMatch">▲</button>
    <button id="searchNext" class="search-btn" data-i18n-title="nextMatch">▼</button>
    <button id="searchClose" class="search-btn search-close" data-i18n-title="closeFind">×</button>
  </div>

  <div id="toastContainer" class="toast-container"></div>

  <script src="scripts/i18n.js"></script>
  <script src="dist/preview.js"></script>
  <script src="scripts/theme.js"></script>
  <script src="scripts/app.js"></script>
</body>
</html>
